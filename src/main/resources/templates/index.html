<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>MCU Tier List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <style>
        body { background-color: #1a1a2e; color: #eee; }
        .navbar { background-color: #16213e; }
        .card { background-color: #16213e; border-color: #0f3460; }
        .table { --bs-table-bg: transparent; --bs-table-color: #eee; }
        .table th { color: #aaa; border-color: #0f3460; }
        .table td { border-color: #0f3460; vertical-align: middle; }
        .poster-thumb { width: 40px; height: 60px; object-fit: cover; border-radius: 4px; }
        .tier-row { display: flex; align-items: center; border-bottom: 1px solid #0f3460; min-height: 80px; }
        .tier-label { width: 120px; min-width: 120px; text-align: center; font-weight: bold;
                      font-size: 1.1rem; padding: 8px; }
        .tier-movies { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; }
        .tier-poster { width: 55px; height: 80px; object-fit: cover; border-radius: 4px; }
        .tier-poster-placeholder { width: 55px; height: 80px; background: #0f3460;
                                   border-radius: 4px; display: flex; align-items: center;
                                   justify-content: center; font-size: 0.6rem; text-align: center;
                                   color: #aaa; padding: 4px; }
        .drag-handle { cursor: grab; color: #aaa; }
        .drag-handle:active { cursor: grabbing; }
        .tier-Excellent { background-color: #ff7f27; }
        .tier-Very-Good { background-color: #ffcc00; color: #000; }
        .tier-Good      { background-color: #00b050; }
        .tier-Weak      { background-color: #4472c4; }
        .tier-Bad       { background-color: #c00000; }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark px-3">
    <span class="navbar-brand fw-bold">🎬 MCU Tier List</span>
    <div class="d-flex align-items-center gap-3">
        <span class="text-light" th:text="${name}"></span>
        <form method="post" action="/logout" class="m-0">
            <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
        </form>
    </div>
</nav>

<div class="container-fluid py-4">

    <!-- Tab navigation -->
    <ul class="nav nav-tabs mb-4" id="mainTabs">
        <li class="nav-item">
            <a class="nav-link" th:classappend="${tab == 'movies'} ? 'active' : ''"
               href="/?tab=movies">Movies</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${tab == 'tierlist'} ? 'active' : ''"
               href="/?tab=tierlist">Tier List</a>
        </li>
    </ul>

    <!-- ===== MOVIES TAB ===== -->
    <div th:if="${tab == 'movies'}">

        <!-- Line chart -->
        <div class="card mb-4 p-3">
            <canvas id="scoreChart" height="80"></canvas>
        </div>

        <!-- Movie table -->
        <div class="card p-3">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th></th>
                        <th>Poster</th>
                        <th>Title</th>
                        <th>Phase</th>
                        <th>Release</th>
                        <th>Score</th>
                        <th>Label</th>
                        <th>Tier</th>
                    </tr>
                </thead>
                <tbody id="movieTableBody">
                    <tr th:each="dto : ${movies}"
                        th:data-id="${dto.movie().id}"
                        th:data-tier="${dto.tier()}">
                        <td>
                            <span class="drag-handle" th:if="${dto.score() != null}">&#8597;</span>
                        </td>
                        <td>
                            <img th:if="${dto.movie().posterUrl != null}"
                                 th:src="${dto.movie().posterUrl}"
                                 class="poster-thumb" th:alt="${dto.movie().originalTitle}"/>
                            <div th:unless="${dto.movie().posterUrl != null}"
                                 class="poster-thumb bg-secondary d-flex align-items-center
                                        justify-content-center text-muted" style="font-size:0.6rem;">
                                No poster
                            </div>
                        </td>
                        <td>
                            <div th:text="${dto.movie().originalTitle}"></div>
                            <small class="text-muted" th:if="${dto.movie().alternativeTitle != null}"
                                   th:text="${dto.movie().alternativeTitle}"></small>
                        </td>
                        <td th:text="${dto.movie().phase != null ? 'Phase ' + dto.movie().phase : '—'}"></td>
                        <td th:text="${dto.movie().releaseDate}"></td>
                        <td>
                            <form method="post"
                                  th:action="@{/movies/{id}/score(id=${dto.movie().id})}">
                                <select name="score" class="form-select form-select-sm"
                                        style="width:auto;" onchange="this.form.submit()">
                                    <option value="" th:selected="${dto.score() == null}">—</option>
                                    <option th:each="s : ${ {0.5,1.0,1.5,2.0,2.5,3.0,3.5,4.0,4.5,5.0} }"
                                            th:value="${s}"
                                            th:text="${s}"
                                            th:selected="${dto.score() != null and dto.score() == s}">
                                    </option>
                                </select>
                            </form>
                        </td>
                        <td th:text="${dto.scoreLabel() != null ? dto.scoreLabel() : '—'}"></td>
                        <td>
                            <span th:if="${dto.tier() != null}"
                                  class="badge"
                                  th:classappend="'tier-' + ${dto.tier().replace(' ', '-')}"
                                  th:text="${dto.tier()}"></span>
                            <span th:unless="${dto.tier() != null}" class="text-muted">—</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- ===== TIER LIST TAB ===== -->
    <div th:if="${tab == 'tierlist'}">
        <div class="card p-0">
            <div th:each="entry : ${tierList}" class="tier-row">
                <div class="tier-label"
                     th:classappend="'tier-' + ${entry.key.replace(' ', '-')}"
                     th:text="${entry.key}">
                </div>
                <div class="tier-movies">
                    <div th:each="dto : ${entry.value}">
                        <img th:if="${dto.movie().posterUrl != null}"
                             th:src="${dto.movie().posterUrl}"
                             th:alt="${dto.movie().originalTitle}"
                             th:title="${dto.movie().originalTitle}"
                             class="tier-poster"/>
                        <div th:unless="${dto.movie().posterUrl != null}"
                             class="tier-poster-placeholder"
                             th:text="${dto.movie().originalTitle}">
                        </div>
                    </div>
                    <span th:if="${entry.value.isEmpty()}" class="text-muted fst-italic ps-2">
                        No movies yet
                    </span>
                </div>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.3/Sortable.min.js"></script>

<script th:inline="javascript">
    /*<![CDATA[*/
    const chartLabels = /*[[${chartLabels}]]*/ [];
    const chartScores = /*[[${chartScores}]]*/ [];

    if (document.getElementById('scoreChart')) {
        new Chart(document.getElementById('scoreChart'), {
            type: 'line',
            data: {
                labels: chartLabels,
                datasets: [{
                    label: 'Score',
                    data: chartScores,
                    borderColor: '#e94560',
                    backgroundColor: 'rgba(233,69,96,0.15)',
                    tension: 0.3,
                    fill: true,
                    pointRadius: 5,
                }]
            },
            options: {
                scales: {
                    y: { min: 0, max: 5, ticks: { color: '#aaa' }, grid: { color: '#0f3460' } },
                    x: { ticks: { color: '#aaa', maxRotation: 45 }, grid: { color: '#0f3460' } }
                },
                plugins: { legend: { labels: { color: '#eee' } } }
            }
        });
    }

    // Drag-and-drop within same tier
    const tbody = document.getElementById('movieTableBody');
    if (tbody) {
        Sortable.create(tbody, {
            handle: '.drag-handle',
            animation: 150,
            onEnd(evt) {
                const rows = [...tbody.querySelectorAll('tr[data-id]')];
                const movedTier = evt.item.dataset.tier;

                const tierIds = rows
                    .filter(r => r.dataset.tier === movedTier)
                    .map(r => parseInt(r.dataset.id));

                fetch('/movies/reorder', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(tierIds)
                });
            }
        });
    }
    /*]]>*/
</script>
</body>
</html>
