<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>MCU Tier List — Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body class="bg-dark text-light">
<div class="d-flex justify-content-center align-items-center vh-100">
    <div class="card bg-secondary text-light p-4" style="min-width: 340px;">
        <h4 class="card-title mb-4 text-center">MCU Tier List</h4>
        <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>
        <form method="post" action="/login">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username"
                       class="form-control" placeholder="Enter your username" required autofocus/>
            </div>
            <button type="submit" class="btn btn-danger w-100">Enter</button>
        </form>
    </div>
</div>
</body>
</html>
