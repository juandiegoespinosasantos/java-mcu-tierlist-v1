<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MCU Tier List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/main.css" />
</head>

<body>

    <nav th:replace="~{fragments/navbar :: navbar('movies')}"></nav>

    <div class="container-fluid py-4">
        <span class="nav-item">See as</span>

        <ul class="nav nav-pills mb-4">
            <li class="nav-item"><a class="nav-link" th:classappend="${view == 'list'} ? 'active' : ''"
                    href="/movies?view=list">List</a></li>
            <li class="nav-item"><a class="nav-link" th:classappend="${view == 'tierlist'} ? 'active' : ''"
                    href="/movies?view=tierlist">Tier List</a></li>
        </ul>

        <!-- ===== LIST VIEW ===== -->
        <div th:if="${view == 'list'}">

            <!-- Line chart -->
            <div class="card mb-4 p-3">
                <canvas id="scoreChart" height="300"></canvas>
            </div>

            <!-- Movie table -->
            <div class="card p-3">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th></th>
                            <th>#</th>
                            <th>Movie</th>
                            <th>Score</th>
                        </tr>
                    </thead>
                    <tbody id="movieTableBody">
                        <tr th:each="dto : ${movies}" th:data-id="${dto.mcuEntry.id}" th:data-tier="${dto.tier}">
                            <td>
                                <span class="drag-handle" th:if="${dto.score != null}">&#8597;</span>
                            </td>
                            <td th:text="${dto.ranking}"></td>
                            <td>
                                <img th:if="${dto.mcuEntry.posterUrl != null}" th:src="${dto.mcuEntry.posterUrl}"
                                    class="poster-thumb" th:alt="${dto.mcuEntry.originalTitle}" />
                                <div th:unless="${dto.mcuEntry.posterUrl != null}" class="poster-thumb bg-secondary d-flex align-items-center
                                        justify-content-center text-muted" style="font-size:0.6rem;">
                                    No poster
                                </div>
                                <span class="movie-title" th:text="${dto.mcuEntry.originalTitle}"></span>
                                <small class="text-muted movie-year"
                                    th:text="${' (' + #temporals.format(dto.mcuEntry.releaseDate, 'yyyy') + ')'}"></small>
                            </td>
                            <td>
                                <span th:if="${dto.score != null}" class="badge"
                                    th:classappend="'tier-' + ${dto.tier.replace(' ', '-')}"
                                    th:text="${#numbers.formatDecimal(dto.score, 1, 1) + '/5.0'}"></span>
                                <span th:unless="${dto.score != null}" class="text-muted">—</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- ===== TIER LIST VIEW ===== -->
        <div th:if="${view == 'tierlist'}">
            <div class="card p-0">
                <div th:each="entry : ${tierList}" class="tier-row">
                    <div class="tier-label" th:classappend="'tier-' + ${entry.key.replace(' ', '-')}"
                        th:text="${entry.key}">
                    </div>
                    <div class="tier-movies">
                        <div th:each="dto : ${entry.value}">
                            <img th:if="${dto.mcuEntry.posterUrl != null}" th:src="${dto.mcuEntry.posterUrl}"
                                th:alt="${dto.mcuEntry.originalTitle}" th:title="${dto.mcuEntry.originalTitle}"
                                class="tier-poster" />
                            <div th:unless="${dto.mcuEntry.posterUrl != null}" class="tier-poster-placeholder"
                                th:text="${dto.mcuEntry.originalTitle}">
                            </div>
                        </div>
                        <span th:if="${entry.value.isEmpty()}" class="text-muted fst-italic ps-2">
                            No movies yet
                        </span>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.3/Sortable.min.js"></script>

    <script th:inline="javascript">
        /*<![CDATA[*/
        const chartLabels = /*[[${chartLabels}]]*/[];
        const chartScores = /*[[${chartScores}]]*/[];

        if (document.getElementById('scoreChart')) {
            new Chart(document.getElementById('scoreChart'), {
                type: 'line',
                data: {
                    labels: chartLabels,
                    datasets: [{
                        label: 'Score',
                        data: chartScores,
                        borderColor: '#e94560',
                        backgroundColor: 'rgba(233,69,96,0.15)',
                        tension: 0.0,
                        fill: true,
                        pointRadius: 5,
                    }]
                },
                options: {
                    scales: {
                        y: { min: 0, max: 5, ticks: { color: '#aaa' }, grid: { color: '#0f3460' } },
                        x: { ticks: { color: '#aaa', maxRotation: 45 }, grid: { color: '#0f3460' } }
                    },
                    plugins: { legend: { labels: { color: '#eee' } } }
                }
            });
        }

        // Drag-and-drop within same tier
        const tbody = document.getElementById('movieTableBody');
        if (tbody) {
            Sortable.create(tbody, {
                handle: '.drag-handle',
                animation: 150,
                onEnd(evt) {
                    const rows = [...tbody.querySelectorAll('tr[data-id]')];
                    const movedTier = evt.item.dataset.tier;

                    const tierIds = rows
                        .filter(r => r.dataset.tier === movedTier)
                        .map(r => parseInt(r.dataset.id));

                    fetch('/movies/reorder', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(tierIds)
                    });
                }
            });
        }
        /*]]>*/
    </script>
</body>

</html>
